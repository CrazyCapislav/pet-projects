# UTF-8 во всей цепочке сборки.
#
# Зачем: исходники, логи и сообщения об ошибках у нас на русском. Windows по
# умолчанию отдаёт консоли кодировку CP866, а JVM пишет UTF-8 — на стыке
# получается «╨Ы╨╡╨╜╤В╨░» вместо «Лента». Само приложение при этом работает
# правильно, ломается только отображение.
#
# file.encoding задаёт кодировку, в которой JVM читает и пишет файлы,
# stdout/stderr.encoding (Java 19+) — отдельно кодировку потоков вывода.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Xmx2g

# Кэширование и параллельная сборка — заметно ускоряют повторные запуски.
org.gradle.caching=true
org.gradle.parallel=true
